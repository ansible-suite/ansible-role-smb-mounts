---
- name: Validate SMB mount mode
  ansible.builtin.assert:
    that:
      - smb_mount_mode in smb_mode_opts
    fail_msg: >-
      Invalid smb_mount_mode '{{ smb_mount_mode }}'.
      Supported modes: {{ smb_mode_opts.keys() | list | join(', ') }}

- name: Install required packages for SMB/CIFS
  ansible.builtin.apt:
    name: cifs-utils
    state: present

- name: Ensure access groups for SMB shares exist
  ansible.builtin.group:
    name: "{{ item.group | default(item.gid) }}"
    gid: "{{ item.gid if (item.gid is defined and item.gid | string is regex('^[0-9]+$')) else (item.group_id | default(omit)) }}"
    state: present
  loop: "{{ smb_shares | default([]) }}"
  when:
    - (item.group is defined and item.group not in ['root', '0']) or
      (item.gid is defined and item.gid | string not in ['root', '0'] and item.gid | string is not regex('^[0-9]+$'))

- name: Add allowed users to mount groups
  ansible.builtin.user:
    name: "{{ item.1 }}"
    groups: "{{ item.0.group | default(item.0.gid) }}"
    append: true
  loop: "{{ smb_shares | subelements('allowed_users', skip_missing=True) }}"
  when: not ansible_check_mode
  loop_control:
    label: "Adding user {{ item.1 }} to group {{ item.0.group | default(item.0.gid) }}"

- name: Ensure credentials directory exists
  ansible.builtin.file:
    path: /etc/samba/credentials
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Generate SMB credentials files from template
  ansible.builtin.template:
    src: smb_creds.j2
    dest: "/etc/samba/credentials/{{ item.name }}.cred"
    mode: '0600'
    owner: root
    group: root
  loop: "{{ smb_shares | default([]) }}"
  no_log: true

- name: Create mount points
  ansible.builtin.file:
    path: "{{ item.mount_point }}"
    state: directory
    mode: "{{ item.mount_mode | default('0755') }}"
  loop: "{{ smb_shares | default([]) }}"

- name: Configure SMB shares in fstab
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "{{ item.share_path }}"
    fstype: cifs
    opts: >-
      {{
        (
          [
            'credentials=/etc/samba/credentials/' ~ item.name ~ '.cred',
            'uid=' ~ (item.uid | default('0')),
            'gid=' ~ (item.group | default(item.gid | default('0'))),
            'dir_mode=' ~ (item.dir_mode | default('0755')),
            'file_mode=' ~ (item.file_mode | default('0644'))
          ]
          + smb_mode_opts[smb_mount_mode]
          + (item.extra_opts | default([]))
        ) | join(',')
      }}
    state: present
  loop: "{{ smb_shares | default([]) }}"